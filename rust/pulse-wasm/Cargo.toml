[package]
name = "pulse-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "DomTokenList",
  "Element",
  "HtmlElement",
  "MessageEvent",
  "NodeList",
  "PointerEvent",
  "WebSocket",
  "Window",
] }
js-sys = "0.3"
